[package]
name = "nomos-platform-xvpe"
version = "0.1.0"
edition = "2024"
publish = false
description = "The platform port, bridged onto XVPE. Wraps any nomos ProcessLauncher as the launcher surface XVPE's own adapters take, so this workspace's agent dispatch is XVPE's engine code rather than a second copy of it -- without moving the 559 use-sites and 33 implementors that already depend on this workspace's own port."

# Band 1p -- the XVPE implementation of the platform port, anticipated in the
# workspace manifest since the port was written.
#
# A pinned cross-repository dependency: XVPE is not published to a registry, so
# it is adopted by git reference and commit, which is the form D-130 names and
# still requires. The revision is recorded here rather than taken from whatever
# a sibling checkout happens to be sitting at; see D-130's second amendment for
# what the 2026-09-10 retirement did and did not reach.
[dependencies]
nomos-platform = { workspace = true }
xvpe-subprocess-execution = { git = "https://github.com/kevinmettias/xvpe.git", rev = "82a3c8fccf4ef7f3759f36d3f320a91d0f96341c" }
xvpe-primitives = { git = "https://github.com/kevinmettias/xvpe.git", rev = "82a3c8fccf4ef7f3759f36d3f320a91d0f96341c" }

[lints]
workspace = true
