[package]
name = "nomos-platform"
version = "0.1.0"
description = "Port traits for everything Nomos needs from the machine underneath it."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { workspace = true }
# The determinism vocabulary the four ports declare in. Protocol zone, which this
# zone may depend on; and the same vocabulary the rest of this workspace's 29
# strategy declarations already use, rather than a second one for the ports alone.
nomos-contracts = { workspace = true }
# The wall-clock value type, carried down into the engine on 2026-09-11 by
# `OD-PLATFORM-003`. This crate re-exports it and keeps only the ledger's wire
# format, which is this workspace's own obligation rather than the type's.
xvpe-clock = { path = "../../../../xvpe/crates/mechanisms/timing/xvpe-clock" }

# The adapter asserts the committed ledger's byte format directly.
[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
