[package]
name = "nomos-cli"
version = "0.1.0"
description = "The `nomos` binary."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "nomos"
path = "src/main.rs"

[dependencies]
nomos-contracts = { workspace = true }
nomos-ledger = { workspace = true }
# One digest function, for the subject a fact is filed under and for the identity of the
# policy this run resolved. Content addressing is the kernel's and is not respelled here.
nomos-model = { workspace = true }
nomos-platform = { workspace = true }
nomos-composer-std = { workspace = true }
nomos-rules = { workspace = true }
# `RegistryError` is what a self-contradictory capability registry one band down
# (`nomos-check-orchestration`) reports back through -- `check.rs` and `gate.rs` both
# render it as `ExitCode::Contradictory`. The registry composition itself (`Registered`,
# `Resolved_Configuration`) moved to `nomos-check-orchestration` under `OD-HOST-002`; this
# crate no longer assembles it, only renders what comes back.
#
# `nomos-lang-rust-scan` is deliberately absent. It cannot serve `nomos_rules::
# Syntax_Requirement`, so registering it would turn a refusal that can be reasoned about
# here into a runtime event nobody sees.
nomos-capability = { workspace = true }
nomos-lang-rust = { workspace = true }
# The one door a workspace state comes through. Used so that the snapshot, generation,
# variant and configuration a fact is filed under come from something real rather than
# from four values invented at the call site — and so that an empty change set is refused
# by the thing that owns the question. This is `nomos-workspace`'s second dependent.
nomos-workspace = { workspace = true }
# The seam between choosing a platform, running a `work` verb and rendering its outcome —
# `work.rs` composes the platform and renders; this crate runs the verb, generic over the
# platform traits, so a second adapter can depend on it without also depending on a platform
# implementation or on how this crate prints an answer. `OD-HOST-001`.
nomos-work-orchestration = { workspace = true }
# The seam between composing the capability registry, ingesting a walk into facts and
# judging them, and finding that walk or rendering what came of it — `check.rs` walks the
# tree and renders; this crate composes and judges, over source and a build variant this
# crate hands it as values. `OD-HOST-002`.
nomos-check-orchestration = { workspace = true }
# MemoryFactStore, the fact store nomos_check_orchestration::RunContext now takes as a
# caller-supplied value rather than building internally, per OD-ANALYSIS-009's own first
# increment — this crate constructs a fresh one per call, same as before.
nomos-analysis = { workspace = true }
# The seam between the `SpecCommand` vocabulary, the shared corpus-assembly plumbing every
# spec verb needs, and the two verbs that touch no store or only describe one --
# `spec.rs` still parses, assembles and dispatches the other seven verbs on its own, over a
# store this crate hands it as a value. `OD-HOST-002`.
nomos-spec-orchestration = { workspace = true }
# The seam for the first-class Gate object ARC-ROADMAP-001 names -- `gate.rs` parses argv
# and renders what came back; this crate composes the rule registry and reports it.
# `plan` still reads no disk and chooses no platform. `run` reads both, the same way
# `check.rs` does, since it walks a tree and calls `nomos-check-orchestration::Run` itself
# -- `gate-orchestration` and `check-orchestration` are both band 40 and neither may depend
# on the other, so that composition lives here rather than in either orchestration crate.
# `P13-GATE-ORCHESTRATION-1`, `P13-GATE-ORCHESTRATION-2`, `P13-GATE-RUN-FIRST-INCREMENT-3`.
nomos-gate-orchestration = { workspace = true }
# The walk `check::sources` and `gate::sources` are each a thin wrapper over. `OD-HOST-008`.
nomos-workspace-discovery = { workspace = true }
# The specification system. A composition root is the only place permitted to name
# these: the spec crates sit beside the kernel rather than above it, and nothing in the
# product may reach them directly. The submission type `request.rs` constructs comes from
# `nomos-spec-model`: `nomos-spec-store` re-exports the accept function but not the value
# it accepts, because the store does not own what a submission is.
nomos-spec-model = { workspace = true }
nomos-spec-project = { workspace = true }
nomos-spec-store = { workspace = true }
# TaskEnvelope, still named directly here for workflow.rs's own Body::ClaudeCode/Body::
# Ollama construction -- P43-AGENT-CANONICAL-SEAM-2 moved agent.rs's own former direct use
# of this crate (building a bare TaskEnvelope) into nomos-agent-orchestration, but this
# dependency survives that move because workflow.rs's own need for it is unrelated.
nomos-agent-contracts = { workspace = true }
# TaskEnvelope.effort's type, since OD-CONTRACTS-004 -- `agent.rs` names a value of it
# directly rather than depending on nomos-agent-contracts alone to re-export one.
nomos-model-package = { workspace = true }
# The seam for correction planning and lifecycle -- `correct.rs` walks the tree and
# renders; this crate composes a real check run and the `nomos-corrections` lifecycle.
# `P40-CORRECTIONS-CANONICAL-SEAM`.
nomos-correction-orchestration = { workspace = true }
# The seam for running an ordered sequence of WorkflowStep declarations against a real
# dispatch target -- `workflow.rs` walks a check step's own tree and renders; this crate
# composes and dispatches. `P40-WORKFLOW-CLI-VERB`.
nomos-workflow-orchestration = { workspace = true }
# The seam for dispatching one TaskEnvelope to a chosen backend both hosts call --
# `agent.rs` supplies `nomos-composer-std`'s launcher, the same choice `check.rs` and `work.rs`
# already make for their own subprocesses; this crate composes the dispatch itself and no
# longer depends on nomos-agent-executor-claude-code or nomos-model-backend-ollama directly.
# `P43-AGENT-CANONICAL-SEAM-2`.
nomos-agent-orchestration = { workspace = true }

[dev-dependencies]
# `check::sources::Read_Entry` and `gate::sources::Read_Entry` hardcode the `"go"`
# extension as a literal rather than depending on this crate in production code -- see
# their own doc comments for why. That literal has nothing tying it back to
# `nomos_lang_go::GO_EXTENSION`, the value it must stay equal to, so a test-only
# dependency is what lets `tests/lang_go_seam.rs` prove the two have not drifted apart
# without giving the shipped binary a dependency the walk does not need.
nomos-lang-go = { workspace = true }
# `P43-AGENT-CANONICAL-SEAM-2` moved this crate's own former production dependency on
# these two backend crates into `nomos-agent-orchestration` -- the shipped binary no
# longer names either directly. `tests/agent_executor_claude_code_seam.rs` and
# `tests/model_backend_ollama_seam.rs` still drive each backend's own public
# `Execute_Task` with a scripted launcher directly, the identical assertion
# `nomos-agent-orchestration`'s own tests now also make over the shared seam; kept here as
# a test-only dependency rather than deleted, so no existing coverage is lost.
nomos-agent-executor-claude-code = { workspace = true }
nomos-model-backend-ollama = { workspace = true }

[lints]
workspace = true
