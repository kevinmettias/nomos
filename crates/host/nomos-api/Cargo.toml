[package]
name = "nomos-api"
version = "0.1.0"
description = "Band 90. A second real caller of orchestration seams nomos-cli otherwise has to itself: nomos_gate_orchestration::Run_Gate, nomos_work_orchestration::Run and nomos_spec_orchestration::Profiles, each producing a JSON-serializable response -- apart from choosing a platform or wiring an actual transport over it."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nomos-contracts = { workspace = true }
nomos-correction-orchestration = { workspace = true }
nomos-gate-orchestration = { workspace = true }
nomos-ledger = { workspace = true }
nomos-model = { workspace = true }
nomos-platform = { workspace = true }
nomos-platform-std = { workspace = true }
nomos-rules = { workspace = true }
nomos-spec-model = { workspace = true }
nomos-spec-orchestration = { workspace = true }
nomos-spec-project = { workspace = true }
nomos-spec-store = { workspace = true }
nomos-work-orchestration = { workspace = true }
nomos-workspace = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
