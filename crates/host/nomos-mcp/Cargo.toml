[package]
name = "nomos-mcp"
version = "0.1.0"
description = "What this workspace offers a model-facing client: the same Gate and Correction verbs nomos-api-transport serves, each with the sentence and the JSON Schema a tool listing needs. The MCP handshake itself is XVPE's as of 2026-09-10."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "nomos-mcp"
path = "src/main.rs"

[dependencies]
# The engine's catalogue contract and the server that speaks the handshake over
# it. This crate names no method of the protocol itself.
xvpe-remote-call = { git = "https://github.com/kevinmettias/xvpe.git", rev = "82a3c8fccf4ef7f3759f36d3f320a91d0f96341c" }
xvpe-remote-call-backend-json = { git = "https://github.com/kevinmettias/xvpe.git", rev = "82a3c8fccf4ef7f3759f36d3f320a91d0f96341c" }
xvpe-primitives = { git = "https://github.com/kevinmettias/xvpe.git", rev = "82a3c8fccf4ef7f3759f36d3f320a91d0f96341c" }

nomos-api-transport = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
