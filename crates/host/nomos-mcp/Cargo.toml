[package]
name = "nomos-mcp"
version = "0.1.0"
description = "An MCP server over stdio, projecting the same Gate and Correction verbs nomos-api-transport already serves -- as MCP tools, dispatched through that crate's own JSON-RPC handler rather than a second one."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "nomos-mcp"
path = "src/main.rs"

[dependencies]
nomos-api-transport = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
