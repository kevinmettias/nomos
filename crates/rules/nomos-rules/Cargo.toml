[package]
name = "nomos-rules"
version = "0.1.0"
description = "Band 30. Rules that judge source, as pure functions over a subject handed in."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nomos-contracts = { workspace = true }
nomos-model = { workspace = true }
# The fact layer. `boundaries.rs` placed this crate at band 30 rather than below the
# language providers precisely so that "the moment one needs a parsed tree it must be
# able to reach a provider rather than vendor a second parser", and OD-RULES-001 takes
# that edge: check names are read from `nomos.cap.syntax.items` facts.
#
# `nomos-cap-syntax` and not `nomos-lang-rust`. A rule states a floor and the registry
# says who can serve it; naming a provider here would be this crate deciding the thing
# the registry exists to decide, and would put a rule at band 30 in the business of
# knowing which languages exist.
nomos-analysis = { workspace = true }
nomos-capability = { workspace = true }
nomos-cap-syntax = { workspace = true }
# nomos-cap-dependency and not nomos-lang-rust-cargo, for the same reason: this crate
# names a capability contract and lets the registry choose who answers it, never the
# provider that does the answering.
nomos-cap-dependency = { workspace = true }
# nomos-cap-controlflow, the identical reasoning: Check_Unread_Reaches_A_Finding names
# nomos.cap.controlflow.reachability, never nomos-lang-rust, which is where the answer
# happens to come from today.
nomos-cap-controlflow = { workspace = true }
# nomos-cap-lint, the identical reasoning: Check_Lint_Diagnostics names
# nomos.cap.lint.diagnostics, never nomos-lang-rust-clippy, which is where the answer
# happens to come from today. OD-RULES-010.
nomos-cap-lint = { workspace = true }
#
# There is no parser here, and that is the end condition OD-RULES-001 wrote down rather
# than a gap. `universe.rs` carried `syn` and `proc-macro2` for one reason — the agreed
# payload of `nomos.cap.syntax.items` carried no doc comment and no declared type, which
# are the two things universe discovery reads. `nomos.syntax.items.v2` carries both, as
# observations bounded by the answering provider's guarantee, so discovery reads facts
# like the rest of this rule and the second Rust front end is gone. See OD-SYNTAX-002.
#
# A rule that grows a parser again is a rule that has stopped taking its subject as an
# argument. If one is ever needed, the fix is a capability, not a dependency here.

[dev-dependencies]
# The real parser, to build fixture payloads in tests and nowhere else.
#
# Not a dependency of the rule, and the distinction is the whole point: the rule names a
# capability and lets the registry choose, while a test needs bytes that a real provider
# would actually have written. Hand-written fixtures were doing that job and drifted the
# moment the schema gained a field — a payload nobody could have produced is a subject the
# rule is not really being tested against. Band 25 observed from band 30, in dev only, so
# `tests/contract`'s dependency bands see nothing and the shipped rule reaches no parser.
nomos-lang-rust = { workspace = true }

[lints]
workspace = true
