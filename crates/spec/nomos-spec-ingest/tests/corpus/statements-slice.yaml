statements:
- id: AGT-001
  kind: Requirement
  canonical_text: Before agent work, Nomos shall produce a typed task envelope containing
    goal, scope, authoritative knowledge context, applicable rules, prohibited changes,
    available tools, and expected output schema.
  canonical_hash: sha256:2bd882723853e34f4262b5c3d78ee0762f18e0594dff643ef26ad1fc93673f6a
  source_document: 06-agents-models-knowledge-evidence-telemetry.md
- id: AGT-002
  kind: Requirement
  canonical_text: Agents shall return structured plans, changes, claims, tests, requested
    verification, assumptions, and unresolved questions.
  canonical_hash: sha256:f712ecde70e8f375d216a5636e3aff78c07cd2b8d235e9db5db64eeb0cdd1288
  source_document: 06-agents-models-knowledge-evidence-telemetry.md
- id: AGT-003
  kind: Requirement
  canonical_text: The validator shall reject out-of-scope files, undeclared dependency
    changes, missing tests/docs, malformed operations, unsupported tools, and unverifiable
    claims.
  canonical_hash: sha256:dc74e64fa759fbfcefa1b5e6367e6b7e95440530aeea70375fbc3a8b49f89e54
  source_document: 06-agents-models-knowledge-evidence-telemetry.md
- id: AGT-004
  kind: Requirement
  canonical_text: Nomos shall expose approved capabilities such as semantic rename
    and find-callers rather than encouraging arbitrary shell/regex replacements.
  canonical_hash: sha256:a2378d8b84f4606652de8decc91908cb82bdad7666a19a308649076996559772
  source_document: 06-agents-models-knowledge-evidence-telemetry.md
- id: AGT-005
  kind: Requirement
  canonical_text: KnowledgeWorkbench shall supply provenance-preserving claims, decisions,
    contradictions, and context; Nomos shall supply deterministic findings and observations.
  canonical_hash: sha256:e8f4aae69018367aa75d6346a9324e094c846820ded7b8220519e0e6df2f434e
  source_document: 06-agents-models-knowledge-evidence-telemetry.md
- id: AGT-006
  kind: Requirement
  canonical_text: Neither system shall depend on the other at runtime for its core
    function; integration shall occur through neutral versioned contracts and MCP
    tools.
  canonical_hash: sha256:bacf2d0f9f8a071aeb34271bd05e2b67fa89a97ff423d05ea32c71f9a0514239
  source_document: 06-agents-models-knowledge-evidence-telemetry.md
- id: AGT-007
  kind: Requirement
  canonical_text: Nomos shall expose a read-only PrepareChangeContext operation through
    API, CLI, MCP, and capable clients. Given a pinned repository snapshot plus a
    symbol, selected scope, or task description, it shall combine KnowledgeWorkbench
    architecture context, claims, design decisions, examples, contradictions, and
    historical evidence with Nomos-resolved applicability, permitted scope, required
    verification, prohibited actions, evidence gaps, approved capabilities, and task-envelope
    inputs.
  canonical_hash: sha256:f18ccdefc96044e2a09bfdb200fb988d9b9143fc6a0ee5e0a7b6a845804cb00d
  source_document: 06-agents-models-knowledge-evidence-telemetry.md
- id: AGT-008
  kind: Requirement
  canonical_text: Nomos shall expose a read-only ContextualizeFinding operation through
    API, CLI, MCP, and capable clients. Given an immutable Finding occurrence, it
    shall preserve the finding identity, rule version, evidence, applicability, severity,
    and gate disposition while attaching KnowledgeWorkbench rationale, motivating
    defects, accepted exceptions, related decisions and claims, prior false-positive
    or suppression history, comparable corrections, contradictions, citations, and
    likely remediation context.
  canonical_hash: sha256:69cf10d56c074bfb8eb256cafeba2d708e1a6aa07fe48269d89025b582276ed1
  source_document: 06-agents-models-knowledge-evidence-telemetry.md
- id: AGT-017
  kind: Requirement
  canonical_text: Post-completion knowledge handoff — After an authorized merge, release,
    or equivalent completion event, Nomos shall be able to produce a provenance-preserving
    CompletionHandoff containing the final ChangeIntent disposition; actual semantic
    and textual changes; final snapshot; findings and finding transitions; suppressions,
    waivers, and their dispositions; tests; runtime or benchmark evidence; accepted,
    rejected, limited, superseded, withdrawn, and pending claims where applicable;
    approvals; rejected alternatives; package, provider, model, executor, workflow,
    rule, and capability-contract versions; and links to commits, reviews, attestations,
    capsules, captures, and other retained artifacts. The handoff shall preserve evidence
    bounds, source roles, authority, contradiction and supersession state, retention
    and privacy treatment, and enough identity and version information for later change
    preparation, audit, and bounded comparison.Every handoff shall have a stable identity
    and content-addressed version. Delivery to a knowledge peer shall be idempotent
    for the same handoff identity and version; retries shall not duplicate records,
    relationships, or evidence bindings. Partial ingestion, rejected items, unavailable
    dependencies, and deferred processing shall remain visible through per-attempt
    and per-item dispositions. Later corrections, commit reverts, benchmark invalidations,
    rationale corrections, decision supersession, retractions, or evidence withdrawals
    shall produce new versioned correction or supersession records linked to the affected
    handoff and items rather than rewriting or deleting prior evidence. Consumers
    shall be able to determine the currently effective disposition while retaining
    the historical record.The handoff may be ingested by KnowledgeWorkbench through
    the neutral Knowledge Integration Adapter, but failure, unavailability, truncation,
    rejection, delayed ingestion, correction, or supersession processing shall not
    alter the completed Nomos gate, run, release, or attestation result. Nomos shall
    not infer that every changed artifact, review statement, benchmark observation,
    agent explanation, accepted suppression, or rejected alternative is an adopted
    architectural decision, generalized claim, or normative rule. Promotion into repository
    policy or executable enforcement shall continue to require the applicable authority,
    epistemic-stage, RulePackage, review, versioning, publication, and rollout lifecycle.
  canonical_hash: sha256:ac05b3f4950aebdf3d5676ed39b8e5fcadf0b565d1c1b278a26590e3581fa5ac
  source_document: 06-agents-models-knowledge-evidence-telemetry.md
- id: AGT-018
  kind: Requirement
  canonical_text: Semantic change authority resolution — Before an agent-originated
    mutation is authorized, Nomos shall classify its predicted effects into SemanticChangeClass
    values including at minimum local implementation, contract-compatible extension,
    public-interface change, dependency-boundary change, architecture-topology change,
    behavioral-default change, correctness or safety obligation change, policy or
    configuration change, rule change, generated-artifact change, and destructive
    removal. Organization and repository policy shall resolve every applicable class
    to an allowed authority level, required approver role, evidence obligations, permitted
    mutation mode, rollback boundary, validation scope, and autonomous-execution disposition.
    Resolution shall consider actual and predicted semantic effects, applicable architecture
    and decision contracts, generated lineage, affected variants, and governing ChangeIntent
    rather than file paths, textual edit size, or the operation label alone. Unresolved
    effects, scope expansion, or newly discovered effects requiring higher authority
    shall pause or reject mutation and create an explicit approval or re-authorization
    dependency; they shall not inherit the original authorization. After staging and
    before publication, Nomos shall compare observed effects with the resolved authorization
    and reject, roll back, or require approval for any unresolved higher-authority
    class. Before mutation, Nomos shall expose a user-visible projection of the resolved
    decision that states the classified effects, governing policy, trust evidence
    where used, required validation, approver roles, and the reason the operation
    is autonomous, preview-only, proposal-only, review-required, or prohibited. The
    projection shall refresh whenever staged or observed effects differ materially
    from predicted effects.
  canonical_hash: sha256:c970460ee39322b1de731d92172d5507b8d5a4452b74935abc44e30c1e71e299
  source_document: 06-agents-models-knowledge-evidence-telemetry.md
- id: CAL-008
  kind: Requirement
  canonical_text: The lifecycle shall preserve the epistemic sequence ObservedFact
    → GeneralizedClaim → AdoptedNorm → ExecutableEnforcement and shall prevent any
    later stage from being inferred solely from the existence of an earlier stage.
  canonical_hash: sha256:6bd95bacd97c6915586c9176334633ce2f9f331a2413221501e4930081fbebab
  source_document: 06-agents-models-knowledge-evidence-telemetry.md
- id: IF-008
  kind: Requirement
  canonical_text: Cross-system protocol ownership — Schemas used to exchange identities,
    context requests, evidence references, task envelopes, operation references, and
    result provenance among Nomos, KnowledgeWorkbench, XVPE, orchestration clients,
    and other peers shall be governed as neutral versioned contracts. No participating
    peer's internal storage model, database identity, native graph type, private API,
    or release-specific implementation type shall become the shared protocol. Protocol
    evolution shall define compatibility ranges, extension namespaces, deprecation,
    migration, unknown-field behavior, and conformance independently from any one
    peer's release lifecycle.
  canonical_hash: sha256:d3fed763598544c555551a5da5a2ec7ec0501b838f60f8bbb3acba8162afe1bc
  source_document: 07-clients-interfaces-deployment-administration.md
- id: MET-007
  kind: Requirement
  canonical_text: A client may not aggregate or blend a metric beyond the descriptor’s
    declared semantics. Non-aggregable metrics must remain at their native granularity
    or use an explicitly named derived metric.
  canonical_hash: sha256:982296a4798d5889e0b0a5046c6a42569096d12b01d3b13802540e0d4e0035d4
  source_document: 05-atlas-architecture-features-tests-runtime.md
- id: PKG-002
  kind: Requirement
  canonical_text: The system shall derive effective rule applicability from the rule’s
    canonical capability requirements, target language features, verified provider
    capabilities, installed and available tools, repository configuration, target
    context, and compatibility-test results. No manually duplicated language-rule
    support list shall be authoritative.
  canonical_hash: sha256:d767fd9cb7d7b64202df2fb39ace1734c3b37c09c54045ae3f7568e58b9fb80d
  source_document: 03-packages-providers-rules-and-applicability.md
- id: US-AGT-001
  kind: User Story
  canonical_text: '— Developer: As a developer, I can prepare an agent change that
    includes architecture context, relevant decisions, applicable rules, permitted
    paths, required tests, and forbidden actions.'
  canonical_hash: sha256:c0df26048521a01115817641e5e28b3a5199b06852fffbe15bc04fe2cba6a8bc
  source_document: 06-agents-models-knowledge-evidence-telemetry.md
- id: US-AGT-002
  kind: User Story
  canonical_text: '— Developer: As a developer, I can review an agent’s plan, assumptions,
    expected artifacts, and requested scope expansion before edits are applied.'
  canonical_hash: sha256:cfc33d3da752ffaef65cdcc7990c2ffeedaf04b210734b5cea9c4f6ed9f36d45
  source_document: 06-agents-models-knowledge-evidence-telemetry.md
