[package]
name = "nomos-spec-ingest"
version = "0.1.0"
description = "Ingest of the v14 corpus into the specification store."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nomos-spec-model = { workspace = true }
nomos-spec-store = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
zip = { workspace = true }
rusqlite = { workspace = true }

[dev-dependencies]
# The restoration's own acceptance is a preservation run over the reconciled store, so the
# test needs the validator. A dev-dependency, so band 13 does not acquire a band 14 edge:
# the boundary test excludes dev-dependencies from the ordering for exactly this case.
nomos-spec-validate = { workspace = true }

[lints]
workspace = true
