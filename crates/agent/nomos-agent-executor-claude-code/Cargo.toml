[package]
name = "nomos-agent-executor-claude-code"
version = "0.1.0"
description = "The Claude Code AgentExecutor adapter: dispatches a TaskEnvelope's goal to Claude Code as a subprocess, bounded by OD-EXECUTOR-001's structural capability boundary, and reads back an AgentExecutionOutcome. Renamed from nomos-agent-executor -- OD-EXECUTOR-001's own amendment says why."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nomos-agent-contracts = { workspace = true }
nomos-model-package = { workspace = true }
nomos-platform = { workspace = true }
# The dispatch itself, and the bridge from this workspace's launcher onto the
# surface the engine's adapters take.
nomos-platform-xvpe = { workspace = true }
xvpe-agent-execution = { path = "../../../../xvpe/crates/subsystems/xvpe-agent-execution" }
xvpe-agent-backend-claude-code = { path = "../../../../xvpe/crates/backends/agent/xvpe-agent-backend-claude-code" }
serde_json = { workspace = true }

[dev-dependencies]
nomos-contracts = { workspace = true }
nomos-ledger = { workspace = true }
nomos-platform-std = { workspace = true }

[lints]
workspace = true
