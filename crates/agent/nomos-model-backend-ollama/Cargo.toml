[package]
name = "nomos-model-backend-ollama"
version = "0.1.0"
description = "The first real ModelBackend adapter (OD-PACKAGE-013): dispatches a TaskEnvelope's goal to a local Ollama model as a subprocess, bounded by OD-EXECUTOR-004's structural capability boundary, and reads back an AgentExecutionOutcome. Independent of nomos-agent-executor-claude-code, the one real AgentExecutor -- structurally parallel, no shared trait, and no longer the same package kind."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nomos-agent-contracts = { workspace = true }
nomos-platform = { workspace = true }
# The dispatch itself, and the bridge from this workspace's launcher onto the
# surface the engine's adapters take.
nomos-platform-xvpe = { workspace = true }
xvpe-agent-execution = { path = "../../../../xvpe/crates/subsystems/xvpe-agent-execution" }
xvpe-agent-backend-ollama = { path = "../../../../xvpe/crates/backends/agent/xvpe-agent-backend-ollama" }

[dev-dependencies]
nomos-contracts = { workspace = true }
nomos-ledger = { workspace = true }
nomos-model-package = { workspace = true }
nomos-platform-std = { workspace = true }

[lints]
workspace = true
