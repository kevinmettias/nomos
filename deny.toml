[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Every member of this workspace is `publish = false` with `license = "UNLICENSED"`, which
# is not an SPDX expression and cannot be made into one — there is no SPDX identifier
# meaning "not licensed for distribution". Without this, the first execution of this file
# refused all 22 members as unlicensed third-party code: a true reading of the letter that
# says nothing whatever about a dependency. The allowlist below is what this file is for,
# and it still governs everything that is not a member of this workspace.
private = { ignore = true }
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The line above is aimed at a registry dependency with no version bound. A `{ path = … }`
# dependency carries no version either, so every first-party edge in this workspace reads
# as a wildcard: 19 of the 22 members were refused on the first execution of this file, for
# depending on each other. cargo-deny permits the exemption only for `publish = false`
# crates, which is exactly the case being exempted here, so `wildcards = "deny"` keeps its
# whole meaning for the dependencies it was written about.
allow-wildcard-paths = true

# A headless Nomos must not acquire a GPU, windowing or UI stack transitively.
#
# This is not a preference. `nomos-host-local` is a service composition root, and
# the platform contract Nomos consumes says a headless application resolves only the
# platform components its own closure requires. The nearest sibling composition,
# `xvpe-composer-headless`, is an OFFSCREEN GPU composer — it depends on wgpu and
# egui to render a bounded number of frames without a window — so "headless" there
# means "no window system", not "no graphics". Reusing it would put a GPU stack
# under a CLI. This ban is what makes the distinction hold mechanically rather than
# by intention, and it is why `nomos-host-local` takes the documented
# bypass-the-composer lane instead.
#
# Lift an entry here only when a desktop client crate exists that legitimately needs
# it, and scope the lift to that crate rather than to the workspace.
deny = [
    { name = "wgpu" },
    { name = "egui" },
    { name = "winit" },
    { name = "ash" },
    { name = "naga" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
