# The XVPE crossing, declared once. `D-130`'s surviving clause requires it be adopted by
# git reference and commit, and `OD-PLATFORM-004` denies a local substitution any
# authority; neither says where the reference is spelled. It was spelled fifteen times
# across seven member manifests until a revision bump became fifteen edits that had to
# agree, caught only afterwards and only by
# `tests/contract/tests/boundaries/lock_pinning.rs`. Here it is one edit, and that guard
# reads this table as the declaring site while still reading every member, so a member
# that re-pins locally is still a second revision and still fails.
xvpe-agent-backend-claude-code = { git = "https://github.com/kevinmettias/xvpe.git", rev = "82a3c8fccf4ef7f3759f36d3f320a91d0f96341c" }
xvpe-agent-backend-ollama = { git = "https://github.com/kevinmettias/xvpe.git", rev = "82a3c8fccf4ef7f3759f36d3f320a91d0f96341c" }
xvpe-agent-execution = { git = "https://github.com/kevinmettias/xvpe.git", rev = "82a3c8fccf4ef7f3759f36d3f320a91d0f96341c" }
xvpe-clock = { git = "https://github.com/kevinmettias/xvpe.git", rev = "82a3c8fccf4ef7f3759f36d3f320a91d0f96341c" }
xvpe-diagnostics = { git = "https://github.com/kevinmettias/xvpe.git", rev = "82a3c8fccf4ef7f3759f36d3f320a91d0f96341c" }
xvpe-language-server-backend-lsp = { git = "https://github.com/kevinmettias/xvpe.git", rev = "82a3c8fccf4ef7f3759f36d3f320a91d0f96341c" }
xvpe-primitives = { git = "https://github.com/kevinmettias/xvpe.git", rev = "82a3c8fccf4ef7f3759f36d3f320a91d0f96341c" }
xvpe-remote-call = { git = "https://github.com/kevinmettias/xvpe.git", rev = "82a3c8fccf4ef7f3759f36d3f320a91d0f96341c" }
xvpe-remote-call-backend-json = { git = "https://github.com/kevinmettias/xvpe.git", rev = "82a3c8fccf4ef7f3759f36d3f320a91d0f96341c" }
xvpe-subprocess-execution = { git = "https://github.com/kevinmettias/xvpe.git", rev = "82a3c8fccf4ef7f3759f36d3f320a91d0f96341c" }

serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = "1"
# The LSP transport and wire types used to be pinned here. They moved to
# `xvpe-language-server-backend-lsp` on 2026-09-10 with the server itself: `nomos-lsp` now
# supplies only the thing that judges, and names no protocol library at all.
base64 = "0.22"
blake3 = "1"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_yaml_ng = "0.10"
# Deflate only. The archives are ordinary zips, and the other backends are
# compression formats this corpus does not contain.
zip = { version = "4", default-features = false, features = ["deflate"] }

# rust-analyzer's own semantic-analysis engine, published as a library rather than
# vendored, for `nomos-lang-rust-compiler`'s real compiler-backed provider. Pinned to an
# exact version rather than a caret range, and to `=0.0.293` specifically rather than a
# newer one: the rust-analyzer project bumps this whole family's transitive floor ahead
# of releasing it, so the newest release compatible with `rust-version = "1.88"` (this
# workspace's own floor, `OD-GATE-008`) is several releases behind the newest one
# published, not the newest one available. A caret range would let a routine `cargo
# update` silently raise this workspace's real compile floor past what it declares.
ra_ap_hir = "=0.0.293"
ra_ap_ide_db = "=0.0.293"
ra_ap_load-cargo = "=0.0.293"
ra_ap_project_model = "=0.0.293"
ra_ap_syntax = "=0.0.293"
# Already part of `ra_ap_hir`'s own dependency graph; a direct dependency here so
# `nomos-lang-rust-compiler` can turn a resolved text offset into a line and column
# without re-deriving what its own transitive dependency already computes.
line-index = "=0.1.2"

# Workspace-wide lint policy, mirrored from F:\repos\xvpe\Cargo.toml. Crates inherit
# it by declaring `lints.workspace = true`. The severity choices are XVPE's and the
# reasoning is recorded there; the two that matter most here are `unwrap_used` and
# `indexing_slicing`, because a panic inside the analysis kernel is a determinism
# defect (a replay must reach the same panic at the same step) and not merely a bug.
[workspace.lints.rust]
# Project-owned function names use command-style `Pascal_Snake_Case` instead of
# Rust's lower-snake convention. This is the workspace convention, not an oversight.
non_snake_case = "allow"
unsafe_code = "warn"
private_interfaces = "deny"
private_bounds = "deny"
missing_docs = "allow"

[workspace.lints.clippy]
# This table is the one place that states what severity every clippy lint in this workspace
# runs at, for a contributor's own machine and for the gate alike. `.github/workflows/gate.yml`'s
# `Lint` step runs `cargo clippy --workspace --all-targets` with no promotion flag of its own,
# so what fails there is exactly what fails a bare `cargo clippy` run here. It did not always:
# the step used to add `-- -D warnings`, which silently promoted `clippy::all` and
# `clippy::pedantic` (`warn` below) to hard failures in CI only, and nothing here said so.
# `OD-GATE-007` is why the flag was removed rather than mirrored into this table as `deny`.
#
# `priority = -1` lets the specific lints below override these group levels.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
float_cmp = "deny"
# Explicit `return` is the workspace convention — a deliberate departure from Rust's
# tail-expression idiom — so this lint is silenced.
needless_return = "allow"
# `unwrap()` is forbidden outside tests; `expect("<invariant>")` is the sanctioned
# form, so `expect_used` is intentionally NOT enabled. Tests are exempted via
# `allow-unwrap-in-tests` in clippy.toml.
unwrap_used = "deny"
arithmetic_side_effects = "deny"
indexing_slicing = "deny"

[profile.dev]
debug = 1

[profile.release]
codegen-units = 1
lto = "thin"
