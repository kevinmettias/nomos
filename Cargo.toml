[workspace]
members = [
    # Band 0 — contracts. What earns a place here is OD-CONTRACTS-001 and the band table is
    # README.md; neither is restated in this file, which nothing reads back.
    # Depends on serde and nothing else; `contracts_names_nothing` asserts it.
    "crates/contracts/nomos-contracts",

    # Band 1 — kernel. Canonical identity and the content-addressed document store.
    "crates/kernel/nomos-model",
    "crates/kernel/nomos-store",

    # Band 1p — platform port. Traits in `nomos-platform`, implementations beside it.
    # `nomos-platform-xvpe` is deliberately absent until XVPE stabilizes.
    "crates/platform/nomos-platform",
    "crates/platform/nomos-platform-std",

    # Band 2 — substrate. The work ledger and, later, capability and applicability.
    "crates/substrate/nomos-ledger",
    "crates/substrate/nomos-capability",
    "crates/substrate/nomos-workspace",
    "crates/substrate/nomos-analysis",

    # Band 2 — capability contracts. What providers agree a question means, above the
    # registry that resolves it and below everything that offers against it. A contract
    # gets a home here once more than one party names it; until then it may live beside
    # its only provider.
    "crates/capabilities/nomos-cap-syntax",

    # Band 2 — the language-agnostic manifest core. PackageId, PackageKind and PKG-007's
    # four version domains, minus any typed version-domain abstraction or provider
    # allowlist a specific language would supply -- those are a language-specific
    # package crate's own job. Below the language providers: it names none of them.
    # `OD-PACKAGE-007`.
    "crates/packages/nomos-package",

    # Band 2 — language providers. The first crates that read code this workspace did
    # not write. Each one offers a capability through the registry and is named by
    # nothing below it, so a language can be added or dropped without a recompile
    # anywhere else.
    "crates/languages/nomos-lang-rust",
    "crates/languages/nomos-lang-rust-scan",

    # Band 25 — nomos.cap.dependency.edges' one provider. Different shape from its two
    # siblings above: it runs `cargo metadata` and reads the filesystem for itself, the
    # only I/O any provider in this workspace performs. `OD-RULES-003`.
    "crates/languages/nomos-lang-rust-cargo",

    # Band 23 — the nomos.cap.dependency.edges contract, alongside nomos-cap-syntax. Not
    # left beside its provider the way nomos.cap.module.index is: nomos-rules is a real
    # second party to it from the day it was written. `OD-CAPABILITY-002`.
    "crates/capabilities/nomos-cap-dependency",

    # Band 2 — package manifests. The Rust installable-unit manifest format: PackageId,
    # PackageKind and PKG-007's four version domains, given a real reader that refuses
    # what it cannot resolve. Wraps nomos-package's generic core with RustEdition
    # resolution and this workspace's two Rust providers. Above the language providers it
    # registers, since it names them; below rules, which it does not touch.
    # `OD-PACKAGE-001`, `OD-PACKAGE-007`.
    "crates/packages/nomos-lang-package",

    # Band 3 — rules. The first thing here that judges code rather than paperwork. A
    # rule is a pure function from source text to findings: it names no language
    # provider and opens no file, so the caller decides what tree is being judged and a
    # test can hand it code that no longer exists anywhere.
    "crates/rules/nomos-rules",

    # Band 35 — corrections. The step that applies what a rule found. Above rules
    # deliberately, with room between: a correction candidate may one day need to name
    # a finding a rule produced, and a band below rules would have forbidden that edge.
    "crates/corrections/nomos-corrections",

    # Band 40 — orchestration. Running a `nomos work` verb against a caller-chosen
    # platform, apart from choosing that platform and apart from rendering the answer.
    # Above the ledger it dispatches to and the platform port it is generic over, below
    # every composition root that could call it. `OD-HOST-001`.
    "crates/orchestration/nomos-work-orchestration",

    # Band 40 — orchestration. Composing the capability registry, ingesting
    # already-walked source into facts and judging it, apart from choosing a platform,
    # walking a tree or rendering the answer. `OD-HOST-002`.
    "crates/orchestration/nomos-check-orchestration",

    # Band 40 — orchestration. Assembling the specification store from the embedded
    # governing records and a caller-named corpus, and answering what it holds, apart
    # from choosing a platform or rendering the answer. `OD-HOST-002`.
    "crates/orchestration/nomos-spec-orchestration",

    # Band 40 — orchestration. The seam for the first-class Gate object
    # `ARC-ROADMAP-001` names, starting with `Plan`: a real rule registry, reported
    # back whole, apart from selecting scope, choosing a platform or rendering the
    # answer.
    "crates/orchestration/nomos-gate-orchestration",

    # Band 1 — the specification system. Reaches the product only through a
    # KnowledgeCapability, never directly.
    "crates/spec/nomos-spec-model",
    "crates/spec/nomos-spec-store",
    "crates/spec/nomos-spec-bundle",
    "crates/spec/nomos-spec-ingest",
    "crates/spec/nomos-spec-validate",
    "crates/spec/nomos-spec-project",

    # Band 10 — host. Composition roots and binaries.
    "crates/host/nomos-cli",

    # Band 91. A report over this repository's own git history, run by a human on
    # demand and invoked from nowhere else in this workspace: OD-STORE-002's Worked
    # Case join between a crate's tests/contract/surface/ snapshot and docs/records/,
    # for a caller-given commit range. Bin-only, like nomos-cli.
    "crates/host/nomos-surface-provenance",

    # Assertions about the workspace itself: dependency bands, the contracts
    # allowlist, and module reachability.
    "tests/contract",

    # The vertical slice. A peer of tests/contract rather than a layer over it: that
    # crate watches the workspace's shape from outside and compiles against almost
    # nothing, this one drives the product through every seam. Neither may name the
    # other.
    "tests/integration",
]

resolver = "3"

[workspace.package]
edition = "2024"
# 1.88 is not a policy choice, it is what this workspace compiles on -- measured directly rather
# than read from a changelog. `cargo check --workspace --all-targets` under `RUSTUP_TOOLCHAIN=1.85`
# and `=1.87` both refuse today's nine `&& let` chains with `error[E0658]: let expressions in this
# position are unstable` (let chains stabilized under edition 2024 in Rust 1.88); the same command
# under `=1.88.0` exits 0. See `OD-GATE-008`. The `Compatibility floor` lane in
# `.github/workflows/gate.yml` exercises this number on every run, so the next feature that raises
# it is reported by CI rather than discovered the way this one was.
rust-version = "1.88"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
nomos-contracts = { path = "crates/contracts/nomos-contracts" }
nomos-model = { path = "crates/kernel/nomos-model" }
nomos-store = { path = "crates/kernel/nomos-store" }
nomos-platform = { path = "crates/platform/nomos-platform" }
nomos-platform-std = { path = "crates/platform/nomos-platform-std" }
nomos-ledger = { path = "crates/substrate/nomos-ledger" }
nomos-capability = { path = "crates/substrate/nomos-capability" }
nomos-workspace = { path = "crates/substrate/nomos-workspace" }
nomos-analysis = { path = "crates/substrate/nomos-analysis" }
nomos-cap-syntax = { path = "crates/capabilities/nomos-cap-syntax" }
nomos-cap-dependency = { path = "crates/capabilities/nomos-cap-dependency" }
nomos-lang-rust = { path = "crates/languages/nomos-lang-rust" }
nomos-lang-rust-scan = { path = "crates/languages/nomos-lang-rust-scan" }
nomos-lang-rust-cargo = { path = "crates/languages/nomos-lang-rust-cargo" }
nomos-package = { path = "crates/packages/nomos-package" }
nomos-lang-package = { path = "crates/packages/nomos-lang-package" }
nomos-rules = { path = "crates/rules/nomos-rules" }
nomos-corrections = { path = "crates/corrections/nomos-corrections" }
nomos-work-orchestration = { path = "crates/orchestration/nomos-work-orchestration" }
nomos-check-orchestration = { path = "crates/orchestration/nomos-check-orchestration" }
nomos-spec-orchestration = { path = "crates/orchestration/nomos-spec-orchestration" }
nomos-gate-orchestration = { path = "crates/orchestration/nomos-gate-orchestration" }
nomos-integration-tests = { path = "tests/integration" }
nomos-spec-model = { path = "crates/spec/nomos-spec-model" }
nomos-spec-store = { path = "crates/spec/nomos-spec-store" }
nomos-spec-bundle = { path = "crates/spec/nomos-spec-bundle" }
nomos-spec-ingest = { path = "crates/spec/nomos-spec-ingest" }
nomos-spec-validate = { path = "crates/spec/nomos-spec-validate" }
nomos-spec-project = { path = "crates/spec/nomos-spec-project" }

serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = "1"
base64 = "0.22"
blake3 = "1"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_yaml_ng = "0.10"
# Deflate only. The archives are ordinary zips, and the other backends are
# compression formats this corpus does not contain.
zip = { version = "4", default-features = false, features = ["deflate"] }

# Workspace-wide lint policy, mirrored from F:\repos\xvpe\Cargo.toml. Crates inherit
# it by declaring `lints.workspace = true`. The severity choices are XVPE's and the
# reasoning is recorded there; the two that matter most here are `unwrap_used` and
# `indexing_slicing`, because a panic inside the analysis kernel is a determinism
# defect (a replay must reach the same panic at the same step) and not merely a bug.
[workspace.lints.rust]
# Project-owned function names use command-style `Pascal_Snake_Case` instead of
# Rust's lower-snake convention. This is the workspace convention, not an oversight.
non_snake_case = "allow"
unsafe_code = "warn"
private_interfaces = "deny"
private_bounds = "deny"
missing_docs = "allow"

[workspace.lints.clippy]
# This table is the one place that states what severity every clippy lint in this workspace
# runs at, for a contributor's own machine and for the gate alike. `.github/workflows/gate.yml`'s
# `Lint` step runs `cargo clippy --workspace --all-targets` with no promotion flag of its own,
# so what fails there is exactly what fails a bare `cargo clippy` run here. It did not always:
# the step used to add `-- -D warnings`, which silently promoted `clippy::all` and
# `clippy::pedantic` (`warn` below) to hard failures in CI only, and nothing here said so.
# `OD-GATE-007` is why the flag was removed rather than mirrored into this table as `deny`.
#
# `priority = -1` lets the specific lints below override these group levels.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
float_cmp = "deny"
# Explicit `return` is the workspace convention — a deliberate departure from Rust's
# tail-expression idiom — so this lint is silenced.
needless_return = "allow"
# `unwrap()` is forbidden outside tests; `expect("<invariant>")` is the sanctioned
# form, so `expect_used` is intentionally NOT enabled. Tests are exempted via
# `allow-unwrap-in-tests` in clippy.toml.
unwrap_used = "deny"
arithmetic_side_effects = "deny"
indexing_slicing = "deny"

[profile.dev]
debug = 1

[profile.release]
codegen-units = 1
lto = "thin"
