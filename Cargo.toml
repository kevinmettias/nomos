[workspace]
members = [
    # Band 0 — contracts. What earns a place here is OD-CONTRACTS-001 and the band table is
    # README.md; neither is restated in this file, which nothing reads back.
    # Depends on serde and nothing else; `contracts_names_nothing` asserts it.
    "crates/contracts/nomos-contracts",

    # Band 1 — kernel. Canonical identity and the content-addressed document store.
    "crates/kernel/nomos-model",
    "crates/kernel/nomos-store",

    # Band 1p — platform port. Traits in `nomos-platform`, implementations beside it.
    # `nomos-platform-xvpe` is deliberately absent until XVPE stabilizes.
    "crates/platform/nomos-platform",
    "crates/platform/nomos-platform-std",

    # Band 19 — substrate. Territory and VerificationPredicate, the two ledger-agnostic
    # primitives `OD-LEDGER-037` found underneath nomos-agent-contracts' reuse of
    # nomos-ledger. Below the ledger and below nomos-agent-contracts, so both may depend
    # on it; nomos-ledger re-exports both, unchanged, for its own claim/overlap and
    # finish logic. `OD-LEDGER-037`.
    "crates/substrate/nomos-scope-verification",

    # Band 2 — substrate. The work ledger and, later, capability and applicability.
    "crates/substrate/nomos-ledger",
    "crates/substrate/nomos-capability",
    "crates/substrate/nomos-workspace",
    "crates/substrate/nomos-analysis",

    # Band 2 — capability contracts. What providers agree a question means, above the
    # registry that resolves it and below everything that offers against it. A contract
    # gets a home here once more than one party names it; until then it may live beside
    # its only provider.
    "crates/capabilities/nomos-cap-syntax",

    # Band 2 — the language-agnostic manifest core. PackageId, PackageKind and PKG-007's
    # four version domains, minus any typed version-domain abstraction or provider
    # allowlist a specific language would supply -- those are a language-specific
    # package crate's own job. Below the language providers: it names none of them.
    # `OD-PACKAGE-007`.
    "crates/packages/nomos-package",

    # Band 2 — language providers. The first crates that read code this workspace did
    # not write. Each one offers a capability through the registry and is named by
    # nothing below it, so a language can be added or dropped without a recompile
    # anywhere else.
    "crates/languages/nomos-lang-rust",
    "crates/languages/nomos-lang-rust-scan",
    # The first real second-language provider: what Go source says on its face, offered
    # against the same `nomos.cap.syntax.items` contract over `tree-sitter-go` in place of
    # `syn`. `P14-LANG-GO-SYNTAX-PROVIDER`.
    "crates/languages/nomos-lang-go",

    # Band 25 — nomos.cap.dependency.edges' one provider. Different shape from its two
    # siblings above: it runs `cargo metadata` and reads the filesystem for itself, the
    # only I/O any provider in this workspace performs. `OD-RULES-003`.
    "crates/languages/nomos-lang-rust-cargo",

    # Band 25 — nomos.cap.lint.diagnostics' one provider. The first real ToolProvider
    # `OD-RULES-010` decided the shape of: runs `cargo clippy --message-format=json` and
    # reads the filesystem, the same shape as its `nomos-lang-rust-cargo` sibling above,
    # never naming it -- same band.
    "crates/languages/nomos-lang-rust-clippy",

    # Band 25 — nomos.cap.dependency.policy's one provider. `OD-RULES-010`'s second real
    # ToolProvider: runs `cargo deny --format json check bans licenses sources` and reads
    # the filesystem, the same subprocess-backed shape as its siblings above, never naming
    # any of them -- same band.
    "crates/languages/nomos-lang-rust-deny",

    # Band 25 — nomos.cap.rust.copy_clones's one provider, and this workspace's first
    # provider backed by a real compiler semantic API rather than a syntax tree (its
    # siblings above) or another tool's own report (nomos-lang-rust-deny,
    # nomos-lang-rust-clippy). Loads a crate through `ra_ap_hir` -- the rust-analyzer
    # project's own semantic-analysis engine, published as a library -- and asks it to
    # resolve method calls and trait implementations, questions `syn`'s parse tree has no
    # answer to. `P40-COMPILER-BACKED-PROVIDER`.
    "crates/languages/nomos-lang-rust-compiler",

    # Band 25 — a second provider of nomos.cap.dependency.edges, for a Go workspace rather
    # than a Cargo one. Reads go.work/go.mod text directly rather than running a subprocess
    # -- its own module doc says why -- so it names neither of its three siblings above and
    # none of them may name it. `OD-CAPABILITY-009`.
    "crates/languages/nomos-lang-go-modules",

    # Band 25 — the five nomos.cap.*.policy providers (naming, limits, scripting, words,
    # goals), consolidated from six crates into one after OD-PACKAGE-015 found none of them
    # earned an independent crate boundary: no independent versioning, no enforced
    # isolation, and their two real consumers (nomos-check-orchestration and
    # tests/integration) already depended on all five together, every time. Each provider
    # keeps its own module, its own capability contract, and its own ProviderId; the shared
    # standards.json read/parse step OD-RULES-019 decided the five owe is a private module
    # beneath them. `OD-RULES-011`, `OD-RULES-019`, `OD-PACKAGE-015`.
    "crates/repository/nomos-repo-policy",

    # Band 23 — the nomos.cap.dependency.edges contract, alongside nomos-cap-syntax. Not
    # left beside its provider the way nomos.cap.module.index is: nomos-rules is a real
    # second party to it from the day it was written. `OD-CAPABILITY-002`.
    "crates/capabilities/nomos-cap-dependency",

    # Band 23 — the nomos.cap.controlflow.reachability contract, alongside its two
    # siblings above, for the same reason: nomos-rules is a real second party to it from
    # the day it was written. `OD-RULES-008`, `P13-CONTROLFLOW-REACHABILITY-CAPABILITY`.
    "crates/capabilities/nomos-cap-controlflow",

    # Band 23 — the nomos.cap.lint.diagnostics contract, alongside its three siblings
    # above, for the same reason: nomos-rules is a real second party to it from the day
    # it was written. `OD-RULES-010`.
    "crates/capabilities/nomos-cap-lint",

    # Band 23 — the nomos.cap.dependency.policy contract, alongside its four siblings
    # above, for the same reason: nomos-rules is a real second party to it from the day
    # it was written. OD-RULES-010's second real ToolProvider capability, over `cargo
    # deny check bans licenses sources` rather than `cargo clippy`.
    "crates/capabilities/nomos-cap-dependency-policy",

    # Band 23 — the nomos.cap.naming.policy contract, alongside its five siblings above,
    # for the same reason: nomos-rules' casing rules are a real second party to it from
    # the day it was written. OD-RULES-011's first capability: a repository's own
    # declared naming convention, read as data rather than compiled as a constant.
    "crates/capabilities/nomos-cap-naming-policy",

    # Band 23 — the nomos.cap.limits.policy contract, alongside its six siblings above,
    # for the same reason: nomos-rules' threshold rules (file-size triggers, parameter-
    # count caps) are a real second party to it from the day it was written. OD-RULES-011
    # named this threshold family as its own future instance of the naming decision; a
    # repository's own declared numeric thresholds, read as data rather than compiled as
    # a constant.
    "crates/capabilities/nomos-cap-limits-policy",

    # Band 23 — the nomos.cap.scripting.policy contract, alongside its seven siblings
    # above, for the same reason: nomos-rules' declared-tooling-language-for-scripts rule
    # is a real second party to it from the day it was written. A third OD-RULES-011
    # instance: a repository's own declared tooling language and forbidden script
    # extensions, read as data rather than compiled as a constant.
    "crates/capabilities/nomos-cap-scripting-policy",

    # Band 23 — the nomos.cap.words.policy contract, alongside its eight siblings above,
    # for the same reason: nomos-rules' abbreviations rule is a real second party to it
    # from the day it was written. A fourth OD-RULES-011 instance: a repository's own
    # additions to code-standards' default approved-abbreviation vocabulary, read as data
    # rather than compiled as a constant. A bare list rather than scope-qualified rows: a
    # vocabulary addition has no scope to qualify.
    "crates/capabilities/nomos-cap-words-policy",

    # Band 23 — the nomos.cap.goals.policy contract, alongside its nine siblings above, for
    # the same reason: the rule that holds a repository's declared purposes to its declared
    # parts is a real second party to it from the day it was written. A fifth OD-RULES-011
    # instance, and the clearest case for that decision yet: code-standards' own
    # check-goal-traceability reads nothing but the declaration, so there is no version of
    # the rule that could have compiled its parameters in and still meant anything. A small
    # graph rather than rows, a scalar or a list: goals, parts, and the edges between them.
    "crates/capabilities/nomos-cap-goals-policy",

    # Capability Contract zone — nomos.cap.review.finding's contract, bundled with its one
    # provider in the same crate rather than split the way its nine nomos-cap-* siblings
    # above are: OD-CAPABILITY-002's own criterion is a second real party, and this
    # capability has exactly one provider and (once nomos-rules' Check_Review_Findings
    # lands beside it) one reader, so a second crate would buy no independence anybody
    # spends. Classified Capability Contract rather than Provider — unlike
    # nomos-lang-rust-clippy et al., whose contract already lives one crate away in
    # nomos-cap-lint precisely so nomos-rules (Rules zone) can reach the contract without
    # reaching the Provider zone Permits() forbids it from naming — this crate carries
    # both halves itself, so Provider zone would make its fact family structurally
    # unreachable by any rule. ARC-CONNECTOR-001, OD-CONNECTOR-001, OD-CONNECTOR-002.
    "crates/connectors/nomos-connector-coderabbit",

    # Capability Contract zone — nomos.cap.requirement.trace's contract, bundled with its
    # one provider in the same crate for the identical OD-CAPABILITY-002 reason
    # nomos-connector-coderabbit is: exactly one provider, over this repository's own
    # committed requirement assessments under tests/contract/requirements/ rather than
    # standards.json. Promotes tests/contract/tests/requirement_trace's already-correct
    # parsing and comparison logic into a real, gate-composed rule. OD-TRACE-001.
    "crates/capabilities/nomos-cap-requirement-trace",

    # Band 2 — package manifests. The Rust installable-unit manifest format: PackageId,
    # PackageKind and PKG-007's four version domains, given a real reader that refuses
    # what it cannot resolve. Wraps nomos-package's generic core with RustEdition
    # resolution and this workspace's two Rust providers. Above the language providers it
    # registers, since it names them; below rules, which it does not touch.
    # `OD-PACKAGE-001`, `OD-PACKAGE-007`.
    "crates/packages/nomos-lang-rust-package",

    # Band 26 — package manifests. The first ModelBackendPackage/AgentExecutorPackage
    # manifest maturity: identity, PackageKind, PKG-007's first two version domains
    # reused from nomos-package unchanged, and ModelSelection replacing the fourth. A
    # peer of nomos-lang-rust-package, not a dependent of it -- neither names the other.
    # `OD-PACKAGE-010`.
    "crates/packages/nomos-model-package",

    # Band 26 — package manifests. The first RulePackage manifest maturity, measured
    # field by field against four real shipped rules rather than invented. A third peer
    # of nomos-lang-rust-package and nomos-model-package -- none of the three names another.
    # `OD-PACKAGE-008`, `OD-ROADMAP-001`.
    "crates/packages/nomos-rule-package",

    # Band 26 — package manifests. The first real second consumer of nomos-package's
    # generic core: the Go LanguagePackage manifest format, wrapping it with GoVersion
    # resolution and nomos-lang-go's own syntax provider in place of RustEdition and
    # Rust's two. A fourth peer of the three above -- none of the four names another.
    # `OD-PACKAGE-006`, `OD-PACKAGE-007`.
    "crates/packages/nomos-lang-go-package",

    # Band 26 — package manifests. The first ToolProvider manifest maturity: identity,
    # PackageKind (restricted to ToolProvider), PKG-007's first two version domains reused
    # from nomos-package unchanged, and OD-CAPABILITY-013's closed twelve-name FAMILY
    # vocabulary in place of the fourth. Admits this workspace's two real ToolProviders,
    # nomos-lang-rust-clippy and nomos-lang-rust-deny, by their own provider identities. A
    # fifth peer of the four above -- none of the five names another.
    # `OD-CAPABILITY-013`, `P47-TOOLPROVIDER-HAS-NO-PACKAGE-2`.
    "crates/packages/nomos-tool-package",

    # Band 3 — rules. The first thing here that judges code rather than paperwork. A
    # rule is a pure function from source text to findings: it names no language
    # provider and opens no file, so the caller decides what tree is being judged and a
    # test can hand it code that no longer exists anywhere.
    "crates/rules/nomos-rules",

    # Band 35 — corrections. The step that applies what a rule found. Above rules
    # deliberately, with room between: a correction candidate may one day need to name
    # a finding a rule produced, and a band below rules would have forbidden that edge.
    "crates/corrections/nomos-corrections",

    # Band 36 — agent contracts. AGT-001's TaskEnvelope and AGT-002's WorkResult, the
    # typed input and output shape an agent-assisted operation carries. Depends
    # downward on nomos-scope-verification, nomos-contracts and nomos-corrections; names
    # none of nomos-model-package, nomos-rule-package or nomos-lang-rust-package, which are
    # peers at a different band, not dependents of this one. `OD-ROADMAP-001`,
    # `OD-LEDGER-037`.
    "crates/agent/nomos-agent-contracts",

    # Band 37. The Claude Code AgentExecutor adapter: dispatches a TaskEnvelope's goal to
    # Claude Code as a subprocess through nomos-platform's ProcessLauncher, bounded by
    # `OD-EXECUTOR-001`'s structural capability boundary. Above nomos-agent-contracts,
    # whose TaskEnvelope/WorkResult it depends on; does not assemble a WorkResult. Renamed
    # from nomos-agent-executor by `OD-EXECUTOR-001`'s own amendment: one concrete adapter
    # does not get to keep the name a class of them would need.
    "crates/agent/nomos-agent-executor-claude-code",

    # Band 37. The first real ModelBackend adapter (OD-PACKAGE-013), not a second
    # AgentExecutor: dispatches a TaskEnvelope's goal to a local Ollama model as a subprocess
    # through nomos-platform's ProcessLauncher, bounded by `OD-EXECUTOR-004`'s structural
    # capability boundary -- measured against its own mechanism, not inherited from
    # `OD-EXECUTOR-001` by analogy. Same band as nomos-agent-executor-claude-code; neither
    # may name the other, and there is no dispatch trait generic over both.
    "crates/agent/nomos-model-backend-ollama",

    # Band 40 — orchestration. Running a `nomos work` verb against a caller-chosen
    # platform, apart from choosing that platform and apart from rendering the answer.
    # Above the ledger it dispatches to and the platform port it is generic over, below
    # every composition root that could call it. `OD-HOST-001`.
    "crates/orchestration/nomos-work-orchestration",

    # Band 40 — orchestration. Composing the capability registry, ingesting
    # already-walked source into facts and judging it, apart from choosing a platform,
    # walking a tree or rendering the answer. `OD-HOST-002`.
    "crates/orchestration/nomos-check-orchestration",

    # Band 40 — orchestration. Assembling the specification store from the embedded
    # governing records and a caller-named corpus, and answering what it holds, apart
    # from choosing a platform or rendering the answer. `OD-HOST-002`.
    "crates/orchestration/nomos-spec-orchestration",

    # Band 40 — orchestration. The seam for the first-class Gate object
    # `ARC-ROADMAP-001` names, starting with `Plan`: a real rule registry, reported
    # back whole, apart from selecting scope, choosing a platform or rendering the
    # answer.
    "crates/orchestration/nomos-gate-orchestration",

    # Application Service — the one walk every composition root shares: recognizes source
    # by registered language package, not a hand-typed literal, apart from choosing a
    # platform, judging the result or rendering an answer. Four hosts each carried their
    # own copy of the identical walk before this; `OD-HOST-008`.
    "crates/orchestration/nomos-workspace-discovery",

    # Band 41 — orchestration. The seam for correction planning and lifecycle both hosts
    # call: Run_Correction composes nomos-check-orchestration and nomos-corrections into
    # a judged, staged, validated (and optionally committed) outcome, apart from choosing
    # a platform, walking a tree or rendering the answer. One band above
    # nomos-check-orchestration (40) and nomos-corrections (35), the same reason
    # nomos-gate-orchestration sits at 41 rather than beside either.
    # `P40-CORRECTIONS-CANONICAL-SEAM`.
    "crates/orchestration/nomos-correction-orchestration",

    # Band 42 — orchestration. The workflow tier's first real execution increment:
    # running an ordered sequence of `WorkflowStep` declarations, each dispatched to
    # one of this workspace's four real dispatch targets, apart from choosing a
    # platform or rendering the answer. One band above nomos-check-orchestration (40)
    # and nomos-correction-orchestration (41), the identical reason each of those
    # already sits above the band it depends on. `OD-WORKFLOW-005`,
    # `P40-WORKFLOW-CHECK-BODY`, `P40-WORKFLOW-CORRECTION-BODY`.
    "crates/orchestration/nomos-workflow-orchestration",

    # Application Service — the seam for dispatching one TaskEnvelope to a chosen
    # backend both hosts call: Run_Agent_Execute and Run_Agent_Judgment compose
    # nomos-agent-executor-claude-code and nomos-model-backend-ollama into a real
    # AgentDispatchOutcome, apart from choosing a platform or rendering the answer.
    # `P43-AGENT-CANONICAL-SEAM-2`.
    "crates/orchestration/nomos-agent-orchestration",

    # Band 1 — the specification system. Reaches the product only through a
    # KnowledgeCapability, never directly.
    "crates/spec/nomos-spec-model",
    "crates/spec/nomos-spec-store",
    "crates/spec/nomos-spec-bundle",
    "crates/spec/nomos-spec-ingest",
    "crates/spec/nomos-spec-validate",
    "crates/spec/nomos-spec-project",

    # Band 10 — host. Composition roots and binaries.
    "crates/host/nomos-cli",

    # Band 90 — host. A second real caller of nomos_gate_orchestration::Run_Gate,
    # proving the seam P13-GATE-RUN-SEAM-CRATE built is reachable from a composition
    # root other than nomos-cli. A library crate, not a binary: Handle_Gate_Run walks a
    # tree and hands back a JSON-serializable response, with no transport (stdio, HTTP,
    # MCP framing) wired over it yet. `P13-GATE-API-ADAPTER-FIRST-INCREMENT`.
    "crates/host/nomos-api",

    # Band 91. A report over this repository's own git history, run by a human on
    # demand and invoked from nowhere else in this workspace: OD-STORE-002's Worked
    # Case join between a crate's tests/contract/surface/ snapshot and docs/records/,
    # for a caller-given commit range. Bin-only, like nomos-cli.
    "crates/host/nomos-surface-provenance",

    # Band 92 — host. The transport nomos-api deliberately does not wire: JSON-RPC 2.0
    # over a TCP socket, one object per line. Above nomos-api because it depends on it,
    # and a crate may depend only on a crate in a strictly lower band. Serves the three
    # Gate verbs OD-HOST-007 admits and none of the twenty-one repo-tooling handlers that
    # record excludes. `P40-API-TRANSPORT-2`.
    "crates/host/nomos-api-transport",

    # Band 93 — host. An MCP server over stdio, projecting nomos-api-transport's own
    # three Gate verbs as MCP tools through that crate's own dispatch rather than a
    # second one. Above nomos-api-transport because it depends on it. `P40-MCP-SURFACE-4`.
    "crates/host/nomos-mcp",

    # Band 94 — host. A language server over stdio, projecting nomos-check-orchestration's
    # own real `Run` as `textDocument/publishDiagnostics`: a thin translation from
    # `nomos_contracts::Finding` to `lsp_types::Diagnostic`, with no rule judgment of its
    # own. `P42-LSP-PROJECTION`.
    "crates/host/nomos-lsp",

    # Assertions about the workspace itself: dependency bands, the contracts
    # allowlist, and module reachability.
    "tests/contract",

    # The vertical slice. A peer of tests/contract rather than a layer over it: that
    # crate watches the workspace's shape from outside and compiles against almost
    # nothing, this one drives the product through every seam. Neither may name the
    # other.
    "tests/integration",
]

resolver = "3"

[workspace.package]
edition = "2024"
# 1.88 is not a policy choice, it is what this workspace compiles on -- measured directly rather
# than read from a changelog. `cargo check --workspace --all-targets` under `RUSTUP_TOOLCHAIN=1.85`
# and `=1.87` both refuse today's nine `&& let` chains with `error[E0658]: let expressions in this
# position are unstable` (let chains stabilized under edition 2024 in Rust 1.88); the same command
# under `=1.88.0` exits 0. See `OD-GATE-008`. The `Compatibility floor` lane in
# `.github/workflows/gate.yml` exercises this number on every run, so the next feature that raises
# it is reported by CI rather than discovered the way this one was.
rust-version = "1.88"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
nomos-contracts = { path = "crates/contracts/nomos-contracts" }
nomos-model = { path = "crates/kernel/nomos-model" }
