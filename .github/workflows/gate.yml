name: gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The toolchain is pinned in rust-toolchain.toml and honoured automatically.
      # It is nightly because rustfmt's Allman brace option is unstable -- see
      # rustfmt.toml, which also records why `cargo fmt --check` is NOT a gate step.
      - name: Show toolchain
        run: cargo --version && rustc --version

      # Denied lints are part of the gate, not advice. unwrap_used, indexing_slicing
      # and arithmetic_side_effects all deny: a panic on the analysis path is a
      # determinism defect, because a replay must reach the same panic at the same step.
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # The boundary assertions run as ordinary tests above. This step names them
      # separately so a failure is legible in the job list rather than buried among
      # a hundred unit tests -- these are the ones that fail when the architecture
      # has quietly stopped being true.
      - name: Boundaries
        run: cargo test -p nomos-contract-tests

      # The projections this repository promises to ship, re-derived and compared against
      # what is committed. `--require` is what makes an absence fail: without it the
      # command reports on the outputs it happens to find, so deleting both halves of a
      # governed pair would move it to "not built here" and still exit zero -- which would
      # make `rm` the way to silence a drifted publication.
      #
      # Only `diagram-set` is named, and the reason is the runner rather than taste. Ten
      # of the fourteen shipped profiles select corpus content, and no corpus is present
      # here (see the step below), so requiring one would fail for a variable that is not
      # set rather than for a file that drifted. `diagram-set` reads only the relations
      # between the governing records compiled into the binary, so it is reconstructible
      # on any runner. A profile that CANNOT be rebuilt here must not be required here.
      #
      # This is publication policy, not a property of the profile: the catalogue says how
      # each projection is built and nothing there says whether this repository ships it.
      - name: Required projections
        run: cargo run --quiet -p nomos-cli -- spec freshness --into . --require diagram-set

      # None of the three corpora is present on a CI runner: they live outside this
      # repository. So the tests that read them return early and print ok, and this
      # step is the only place the size of that hole appears. --nocapture is what
      # makes it appear -- cargo swallows a passing test's output, which is exactly
      # how sixty-eight assertions came to report success having read nothing.
      #
      # It does not fail. A gate that can never be green is a gate everybody learns
      # to ignore, and a runner without the corpora is the normal case rather than a
      # misconfiguration. What is guarded is the number: tests/contract/tests/
      # corpus_gates.rs fails if the declared count stops matching the source.
      - name: Corpus gates (reports what did not run)
        run: cargo test -p nomos-contract-tests --test corpus_gates -- --nocapture
