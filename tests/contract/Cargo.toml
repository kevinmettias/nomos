[package]
name = "nomos-contract-tests"
version = "0.1.0"
description = "Assertions about the workspace itself: dependency bands, the contracts allowlist, and module reachability."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The rule crate, for recognising a declared universe in a file. Named here rather
# than reimplemented: `nomos check` runs the same recognition, and two scanners for one
# rule is how they come to disagree. Band 3 observed from band 100, which is the
# direction this crate exists to watch.
nomos-rules = { workspace = true }
# The ledger crate, for the document type rather than for its verbs. The agent contract
# names ledger items in its temporary hazards, and checking one has not closed means
# reading the board — through the type that writes it, because a second parser over the
# same JSON is how the two come to disagree about what a finished item looks like.
nomos-ledger = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
